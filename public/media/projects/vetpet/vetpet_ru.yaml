title: "VetPet"
blocks:
  - type: image
    src: /media/projects/vetpet/cover.png
    alt: "Скриншот главного экрана"

  - type: text
    title: "О проекте"
    body: |
      VetPet — платформа для поиска ветеринаров и записи на приём. Сервис объединяет специалистов разных направлений, услуги и абонементы, а также предлагает владельцам питомцев полезные гайды по уходу. Задача — редизайн существующего сайта с фокусом на удобный подбор ветеринара под конкретный запрос.

  # - type: text
  #   links:
  #     - label: Behance
  #       url: "https://www.behance.net/gallery/223476257/Elite-Samui-Responsive-Web-Design"

  - type: divider

  - type: text
    title: "Проблемы"
    bullets:
      - "Сложность выбора: владелец питомца не всегда знает, какой именно специалист нужен — интерфейс должен помочь с подбором по направлению или услуге"
      - 'Широкий ассортимент предложений  — нужно структурировать так, чтобы пользователь не терялся'
      - 'Устаревший визуальный язык, не соответствующий уровню современного медицинского сервиса'
      - 'Отсутствие прозрачности в услугах и их стоимости'
  - type: divider
  - type: text
    title: "Решения"
    bullets:
      - 'Провела UX-аудит существующего сайта: выявила  несоответствия пользовательским ожиданиям и проблему разных сценариев пользователей'    
      - 'Переработала навигацию и структуру: чёткое разделение между подбором специалиста, контентом (гайды, статьи) и коммерческими предложениями (услуги, абонементы)'
      - 'Спроектировала сценарий подбора ветеринара по направлению или типу услуги — без необходимости заранее знать нужного специалиста'
      - 'Разработала новый визуальный язык: современный, дружелюбный, вызывающий доверие у владельцев питомцев'
  - type: divider
  - type: text
    title: "Структура сайта"
    bullets:
      - 'Главная — поиск специалиста, ключевые направления, популярные услуги, абонементы, отзывы, гайды, запись на консультацию'    
      - 'Направления — все направления, карточка конкретного направления'
      - 'Специалисты — карточка специалиста (bio, специализация, услуги, стоимость, запись на приём)'
      - 'Личный кабинет — записи, история, купленные абонементы'
      - 'Блог — ветеринарные статьи'
  - type: divider

