title: "AZN Meeting"
blocks:

  - type: image
    src: /media/projects/aznm/case_cover.png
    alt: "Main screen screenshot"

  - type: text
    title: "Overview"
    body: |
      AZN Meeting is a video identity verification platform for businesses. The service enables companies to verify clients online without requiring an in-person visit, with support for AI and machine learning. The goal was to create a landing page from scratch that explains a complex product in simple terms and converts interest into demo requests.

  - type: divider

  - type: text
    title: "Challenges"
    bullets:
      - "Need to quickly communicate business value"
      - "Diverse target audience (fintech, marketplaces, services, government organizations)"
      - "Two types of users within the product (clients and administrators) with different scenarios and tasks"
      - "Primary conversion goal — demo request"

  - type: divider

  - type: text
    title: "Solutions"
    bullets:
      - "Built the landing structure based on a ‘problem → solution’ approach: benefits → offering → target audience → how it works → call to action"
      - "Separated the ‘What we offer’ section for clients and administrators"
      - "Visualized use cases through a ‘Who it’s for’ diagram with industries and examples"
      - "Designed a step-by-step ‘How it works’ section to reduce the barrier for an unfamiliar product"

  - type: divider

  - type: image
    title: "Landing page"
    src: /media/projects/aznm/landing.png
    alt: "Landing page"

  - type: image
    title: "Application form (desktop and mobile versions)"
    src: /media/projects/aznm/form.png
    alt: "Application form (desktop and mobile versions)"

  - type: image
    title: "Wireframes"
    subtitle: "The work started with wireframes — at this stage, the focus was on structure and content flow without being distracted by visuals. The goal was to find the right order of blocks: how to guide the user from initial awareness to the target action without unnecessary steps."
    src: /media/projects/aznm/wireframes.png
    alt: "Wireframes"

  - type: text
    title: "Thanks for watching!"

  - type: divider

