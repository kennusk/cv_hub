title: "AZN Meeting"
blocks:
  - type: image
    src: /media/projects/aznm/case_cover.png
    alt: "Скриншот главного экрана"

  - type: text
    title: "О проекте"
    body: |
      AZN Meeting — платформа видеоверификации личности для бизнеса. Сервис позволяет проводить верификацию клиентов онлайн без визита в офис, с поддержкой ИИ и машинного обучения. Задача — создать лендинг с нуля, который объясняет сложный продукт простым языком и конвертирует интерес в заявку на демоверсию.

  - type: divider

  - type: text
    title: "Проблемы"
    bullets:
      - "Необходимость быстро донести ценность для бизнеса"
      - "Разная целевая аудитория (финтех, маркетплейсы, сервисы, госструктуры)"
      - "Два типа пользователей внутри продукта (клиенты и администраторы ) с разными сценариями и задачами"
      - "Главное целевое действие — заявка на демо"

  - type: divider

  - type: text
    title: "Решения"
    bullets:
      - "Выстроила структуру лендинга по принципу «от проблемы к решению»: преимущества → что предлагаем → для кого → как работает → призыв к действию"
      - "Разделила блок «Что мы предлагаем» для клиентов и для администраторов"
      - "Визуализировала сценарии использования через диаграмму «Для кого» с отраслями и примерами применения"
      - "Разработала пошаговый блок «Как это работает», чтобы снять барьер перед незнакомым продуктом"

  - type: divider

  - type: image
    title: "Лендинг"
    src: /media/projects/aznm/landing.png
    alt: "Лендинг"

  - type: image
    title: "Форма заявки (десктоп и мобильная версии)"
    src: /media/projects/aznm/form.png
    alt: "Форма заявки (десктоп и мобильная версии)"

  - type: image
    title: "Вайрфреймы"
    subtitle: "Работа началась с вайрфреймов — на этом этапе я сосредоточилась на структуре и логике подачи контента, не отвлекаясь на визуал. Нужно было найти правильный порядок блоков: как провести пользователя от знакомства с продуктом до целевого действия без лишних шагов."
    src: /media/projects/aznm/wireframes.png
    alt: "Вайрфреймы"

  - type: text
    title: "Спасибо за просмотр!"

  - type: divider

