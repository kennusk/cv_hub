    alt: "Ecobank"

  - type: image
    title: "Design System"
    src: /media/projects/cis/ds.png
    alt: "Design system"

  - type: text
    title: "Results"
    bullets:
      - "A SaaS platform website was created from scratch: from research and architecture to final UI"
      - "Structure optimized for demo conversion"
      - "Enhanced perception of the product’s technological maturity and scalability"
   
