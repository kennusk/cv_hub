title: "Customer Intelligence Suite (CIS)"
blocks:
  - type: image
    src: /media/projects/cis/cover.png
    alt: "Скриншот главного экрана"

  - type: text
    title: "О проекте"
    body: |
      Customer Intelligence Suite (CIS) — SaaS-платформа для бизнеса, которая помогает управлять клиентским опытом: собирать обратную связь, анализировать взаимодействия и принимать решения на основе данных. Задача — создать сайт с нуля, который объясняет сложный продукт и конвертирует интерес в заявку на демо.

  - type: divider

  - type: text
    title: "Задачи"
    bullets:
      - "B2B-продукт с широким набором функций"
      - "Несколько целевых аудиторий — необходимость понятно донести ценность платформы для бизнеса"
      - 'Главное целевое действие — заявка на демо'
      - 'Необходимость поддержки светлой и тёмной темы: платформа должна соответствовать корпоративным стандартам разных клиентов'

  - type: divider

  - type: text
    title: "Решения"
    bullets:
      - 'Спроектировала структуру сайта с нуля: от маркетинговых страниц для новых пользователей до кейсов и раздела решений для тех, кто уже на этапе оценки'    
      - 'Добавила раздел с реальными клиентами (Ecobank, Unity Link) как социальное доказательство для B2B-аудитории'
      - 'Выстроила логику с акцентом на ценности продукта и CTA на демо'
      - 'Разработала два варианта визуального языка — светлую и тёмную тему — единые по компонентам и типографике, но с разным характером восприятия'

  - type: divider

  - type: text
    title: "Структура сайта"
    bullets:
      - 'Главная — предложение, ключевые возможности платформы, CTA на демо'    
      - 'Решения — предложения по отраслям и задачам бизнеса'
      - 'Кейсы продуктов — примеры использования платформы с результатами'
      - 'О нас — миссия, ценности'
      - 'Поддержка — помощь пользователям и документация'
      - 'Политика конфиденциальности — юридические страницы'

